<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders</title>
<style>/* preview.css */</style>
</head>
<body>
<section data-screen="orders" class="min-h-screen p-4 md:p-6">
<header class="mb-6 grid gap-1">
<h1 class="text-2xl font-semibold tracking-tight">Orders</h1>
</header>
<div class="flex flex-col gap-4">
<div class="relative w-full overflow-x-auto">
<table class="w-full caption-bottom text-sm">
<thead class="[&_tr]:border-b">
<tr class="border-b transition-colors hover:bg-muted/50"><th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground">Order</th><th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground">Customer, company</th><th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground">Amount</th></tr>
</thead>
<tbody class="[&_tr:last-child]:border-0">
<tr class="border-b transition-colors hover:bg-muted/50"><td class="p-2 align-middle whitespace-nowrap">#1042</td><td class="p-2 align-middle whitespace-nowrap">Ana Souza</td><td class="p-2 align-middle whitespace-nowrap">$120.00</td></tr>
<tr class="border-b transition-colors hover:bg-muted/50"><td class="p-2 align-middle whitespace-nowrap">#1041</td><td class="p-2 align-middle whitespace-nowrap">&lt;b&gt;Bruno&lt;/b&gt; &amp; {Co}</td><td class="p-2 align-middle whitespace-nowrap">$64.50</td></tr>
<tr class="border-b transition-colors hover:bg-muted/50"><td class="p-2 align-middle whitespace-nowrap">#1040</td><td class="p-2 align-middle whitespace-nowrap"></td><td class="p-2 align-middle whitespace-nowrap">$0.00</td></tr>
</tbody>
</table>
</div>
</div>
</section>
</body>
</html>
