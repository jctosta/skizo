<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders</title>
<style>/* preview.css */</style>
</head>
<body>
<section data-screen="orders" class="min-h-screen p-4 md:p-6">
<header class="mb-6 grid gap-1">
<h1 class="text-2xl font-semibold tracking-tight">Orders</h1>
</header>
<div class="flex flex-col gap-4">
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10">
<div class="grid auto-rows-min items-start gap-1 px-6 grid-cols-[1fr_auto]">
<div class="text-base leading-normal font-medium">Revenue</div>
<div class="text-sm text-muted-foreground">Last 30 days</div>
<div class="col-start-2 row-span-2 row-start-1 self-start justify-self-end flex items-center gap-2">
<p class="text-sm text-muted-foreground">Live</p>
<p class="text-xs">Beta</p>
</div>
</div>
<div class="flex flex-col gap-3 px-6">
<p class="text-sm font-semibold">$12,450</p>
<p class="text-sm text-muted-foreground">+12% vs last month</p>
</div>
<div class="flex items-center px-6 gap-2">
<p class="text-xs text-muted-foreground">Updated hourly</p>
</div>
</div>
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10">
<div class="grid auto-rows-min items-start gap-1 px-6">
<div class="text-base leading-normal font-medium">Pending</div>
</div>
<div class="flex flex-col gap-3 px-6">
<p class="text-sm">18 orders</p>
</div>
</div>
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10">
<div class="flex flex-col gap-3 px-6">
<p class="text-sm">A Card without a header</p>
</div>
</div>
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10">
<div class="grid auto-rows-min items-start gap-1 px-6">
<div class="text-base leading-normal font-medium">Archived</div>
<div class="text-sm text-muted-foreground">Nothing here yet</div>
</div>
</div>
</div>
</section>
</body>
</html>
