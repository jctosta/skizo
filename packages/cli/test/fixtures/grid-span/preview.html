<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>/* preview.css */</style>
</head>
<body>
<section data-screen="dashboard" class="min-h-screen p-6">
<header class="mb-6 grid gap-1">
<h1 class="text-2xl font-semibold tracking-tight">Dashboard</h1>
</header>
<div class="flex flex-col gap-4">
<div class="grid grid-cols-3 gap-4">
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10 col-span-2">
<div class="grid auto-rows-min items-start gap-1 px-6">
<div class="text-base leading-normal font-medium">Revenue</div>
</div>
<div class="flex flex-col gap-3 px-6">
<p class="text-sm">$12,450</p>
</div>
</div>
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10">
<div class="grid auto-rows-min items-start gap-1 px-6">
<div class="text-base leading-normal font-medium">Orders</div>
</div>
<div class="flex flex-col gap-3 px-6">
<p class="text-sm">18</p>
</div>
</div>
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10 col-span-3">
<div class="grid auto-rows-min items-start gap-1 px-6">
<div class="text-base leading-normal font-medium">Customers</div>
</div>
<div class="flex flex-col gap-3 px-6">
<p class="text-sm">1,204</p>
</div>
</div>
</div>
<div class="grid grid-cols-6 gap-4">
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10 col-span-6">
<div class="grid auto-rows-min items-start gap-1 px-6">
<div class="text-base leading-normal font-medium">Wide</div>
</div>
</div>
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10 col-span-1">
<div class="grid auto-rows-min items-start gap-1 px-6">
<div class="text-base leading-normal font-medium">Narrow</div>
</div>
</div>
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10 col-span-4">
<div class="grid auto-rows-min items-start gap-1 px-6">
<div class="text-base leading-normal font-medium">Medium</div>
</div>
</div>
<div class="flex flex-col gap-6 overflow-hidden rounded-xl bg-card py-6 text-sm text-card-foreground shadow-xs ring-1 ring-foreground/10 col-span-5">
<div class="grid auto-rows-min items-start gap-1 px-6">
<div class="text-base leading-normal font-medium">Half</div>
</div>
</div>
</div>
</div>
</section>
</body>
</html>
